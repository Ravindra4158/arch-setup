# Keyring and auth
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Wallpaper
exec-once = fish $hypr/scripts/wallpaper-settings-sync.fish

# Start the interactive parts of the session first so login feels responsive.
exec-once = caelestia shell -d
exec-once = caelestia resizer -d

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Cursors
exec-once = hyprctl setcursor $cursorTheme $cursorSize
exec-once = $hypr/scripts/cursor-sync.fish $cursorTheme $cursorSize

# Low-priority session tasks are delayed so they do not compete with login.
exec-once = $hypr/scripts/background-services.fish
